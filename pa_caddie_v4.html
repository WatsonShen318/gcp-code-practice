<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PA Caddie — Guided Review</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#e31837;--navy:#181c2b;--blue:#2563eb;--blue-lt:#eff6ff;
  --teal:#0284c7;--teal-lt:#e0f2fe;--green:#059669;--green-lt:#ecfdf5;
  --amber:#d97706;--amber-lt:#fffbeb;
  --g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;--g300:#cbd5e1;
  --g400:#94a3b8;--g500:#64748b;--g700:#334155;--g900:#0f172a;
  --white:#fff;--bar:46px;--strip:52px;--layout-top:98px;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:13px;color:var(--g900);
}
/* ─── APPBAR ─────────────────────────────────────── */
.appbar{position:fixed;top:0;left:0;right:0;height:var(--bar);background:var(--navy);border-bottom:1.5px solid rgba(227,24,55,.45);display:flex;align-items:center;padding:0 18px;gap:10px;z-index:300;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.brand{color:var(--red);font-weight:800;font-size:16px;letter-spacing:.1em}
.bar-sep{color:#374151;font-size:20px;font-weight:100}
.bar-title{color:#cbd5e1;font-size:13px;font-weight:400}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.bar-role{color:#94a3b8;font-size:11px}
.demo-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:2px 10px 2px 8px}
.demo-lbl{color:#64748b;font-size:9px;text-transform:uppercase;letter-spacing:.07em;flex-shrink:0}
.demo-sel{background:transparent;color:#cbd5e1;border:none;font-size:11px;cursor:pointer;outline:none}
.demo-sel option{background:#1e293b;color:#fff}
/* ─── STRIP ──────────────────────────────────────── */
.strip{position:fixed;top:var(--bar);left:0;right:0;height:var(--strip);background:var(--white);border-bottom:1px solid var(--g200);box-shadow:0 1px 6px rgba(0,0,0,.06);z-index:200;display:flex;align-items:center;padding:0 24px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sf{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 12px}
.sf:first-child{padding-left:0}
.sf-lbl{font-size:9px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.07em;line-height:1.1;margin-bottom:2px}
.sf-val{font-size:12px;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-val.b{font-weight:700;font-size:13px}
.strip-div{width:1px;height:26px;background:var(--g200);flex-shrink:0}
/* ─── LEG BAR ────────────────────────────────────── */
.leg-bar{position:fixed;top:calc(var(--bar) + var(--strip));left:0;right:0;background:var(--white);border-bottom:1px solid var(--g200);padding:5px 16px;display:flex;align-items:center;gap:6px;height:36px;z-index:190}
.ltab{padding:3px 12px;border-radius:5px;border:1px solid var(--g200);background:var(--white);color:var(--g700);font-size:11px;font-weight:500;cursor:pointer;transition:all .12s}
.ltab.act{background:var(--navy);color:var(--white);border-color:var(--navy)}
.ltab:hover:not(.act){background:var(--g50)}
.ai-dot{display:inline-block;background:#f59e0b;color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:8px;margin-right:3px}
/* ─── LAYOUT ─────────────────────────────────────── */
.layout{display:flex;background:var(--g50);min-height:100vh;margin-top:var(--layout-top)}
/* ─── LEFT RAIL ──────────────────────────────────── */
.left-rail{width:310px;min-width:240px;padding:10px 8px;display:flex;flex-direction:column;gap:7px;position:sticky;top:var(--layout-top);max-height:calc(100vh - var(--layout-top));overflow-y:auto;scrollbar-width:thin;align-self:flex-start}
.lsec{background:var(--white);border:1px solid var(--g200);border-radius:8px;overflow:visible}
.lsec-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;cursor:pointer;user-select:none;border-radius:8px}
.lsec-hdr:hover{background:var(--g50)}
.lsec-ttl{font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.08em}
.lsec-icon{font-size:10px;color:var(--g400)}
.lsec-body{padding:2px 11px 11px}
.mgrid{display:flex;flex-direction:column;gap:4px}
.mr{display:flex;align-items:baseline;gap:6px}
.ml{font-size:10px;color:var(--g400);font-weight:600;min-width:54px;flex-shrink:0}
.mv{font-size:12px;color:var(--g900)}
.pai-grid{display:flex;flex-direction:column;gap:6px}
.pairow{display:flex;flex-direction:column;gap:2px}
.pail{font-size:9px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.06em}
.paiv{font-size:11px;color:var(--g900);line-height:1.4}
.urgent-row{display:flex;align-items:center;gap:7px;margin-top:4px;padding:5px 8px;border-radius:6px;border:1.5px dashed var(--g200);cursor:pointer}
.urgent-row:hover{background:var(--g50)}
.urgent-cb{width:14px;height:14px;cursor:pointer;accent-color:var(--red)}
.urgent-lbl{font-size:11px;color:var(--g700);font-weight:600;cursor:pointer;user-select:none}
.urgent-row.is-urgent{border-color:#fca5a5;background:#fff1f2}
.urgent-row.is-urgent .urgent-lbl{color:var(--red)}
.mc-btns{display:flex;flex-direction:column;gap:5px;padding:2px 0 4px}
.mc-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:var(--white);border:1.5px solid var(--g200);border-radius:7px;color:var(--g700);font-size:12px;font-weight:500;cursor:pointer;text-align:left;transition:all .12s}
.mc-btn:hover{background:var(--blue-lt);border-color:#93c5fd;color:var(--blue)}
.mc-ico{font-size:13px;line-height:1}
.mc-lbl{flex:1}
.mc-arr{font-size:13px;color:var(--g300);transition:color .12s}
.mc-btn:hover .mc-arr{color:var(--blue)}
/* ─── WORKFLOW MAIN ───────────────────────────────── */
.wf-main{flex:1;min-width:0;padding:10px 14px 24px}
.wf-steps{display:flex;flex-direction:column;gap:8px}
/* ─── STEP CARD ───────────────────────────────────── */
.wf-step{background:var(--white);border:1px solid var(--g200);border-radius:10px;box-shadow:0 1px 4px rgba(15,23,42,.06);overflow:hidden;transition:box-shadow .15s}
.wf-step.wf-active{border-color:#93c5fd;box-shadow:0 0 0 2px rgba(37,99,235,.08),0 1px 4px rgba(15,23,42,.06)}
.wf-step.wf-done{border-color:#6ee7b7}
.wf-step.wf-locked{opacity:.55;pointer-events:none}
.wf-step-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;gap:12px}
.wf-step-hdr:hover{background:var(--g50)}
.wf-step-hdr.no-toggle{cursor:default}
.wf-step-hdr.no-toggle:hover{background:transparent}
.wf-step-left{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0}
.wf-step-num{width:24px;height:24px;border-radius:50%;background:var(--g200);color:var(--g700);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.wf-step.wf-active .wf-step-num{background:var(--blue);color:#fff}
.wf-step.wf-done .wf-step-num{background:var(--green);color:#fff}
.wf-step.wf-input{border-color:#fcd34d}
.wf-step.wf-input .wf-step-num{background:#fbbf24;color:#78350f}
.wf-step-meta{flex:1;min-width:0}
.wf-step-title{font-size:13px;font-weight:700;color:var(--g900)}
.wf-step-sub{font-size:11px;color:var(--g500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-step-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.wf-chev{font-size:10px;color:var(--g400)}
/* ─── STATUS BADGES ───────────────────────────────── */
.wf-status{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.st-verified{background:var(--green-lt);color:#065f46;border:1px solid #a7f3d0}
.st-complete{background:var(--green-lt);color:#065f46;border:1px solid #a7f3d0}
.st-active{background:var(--blue-lt);color:#1e40af;border:1px solid #93c5fd}
.st-review{background:var(--amber-lt);color:#92400e;border:1px solid #fde68a}
.st-pending{background:var(--g100);color:var(--g500);border:1px solid var(--g300)}
.st-warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.st-approved{background:var(--green-lt);color:#065f46;border:1px solid #a7f3d0}
.st-denied{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
/* ─── STEP BODY ───────────────────────────────────── */
.wf-step-body{padding:0 16px 16px;border-top:1px solid var(--g100)}
/* ─── INSIGHT ROW ─────────────────────────────────── */
.wf-insight{display:flex;align-items:flex-start;gap:10px;padding:10px 0 8px}
.wf-insight-icon{font-size:15px;line-height:1;flex-shrink:0;padding-top:1px}
.wf-insight-txt{font-size:12px;color:var(--g700);line-height:1.55}
/* ─── DRUG VERIFY BADGES ──────────────────────────── */
.wf-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.wf-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}
.wb-drug{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}
.wb-ndc{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}
/* ─── EXPAND TOGGLE ───────────────────────────────── */
.wf-toggle-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--teal);font-size:11px;font-weight:600;cursor:pointer;padding:3px 0;transition:color .12s}
.wf-toggle-btn:hover{color:var(--blue)}
.wf-sub-section{margin-top:10px;padding:12px;background:var(--g50);border:1px solid var(--g200);border-radius:7px}
.wf-sub-ttl{font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
/* ─── DRUG EDIT FORM ──────────────────────────────── */
.de-row{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.de-lbl{font-size:9px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em}
.de-val{font-size:12px;color:var(--g900);background:var(--white);border:1.5px solid var(--g200);border-radius:5px;padding:5px 9px}
.de-sel{font-size:12px;color:var(--g900);background:var(--white);border:1.5px solid var(--g200);border-radius:5px;padding:5px 9px;cursor:pointer;width:100%}
.de-sel:focus{outline:none;border-color:var(--blue)}
/* ─── MOCK CLAIM ──────────────────────────────────── */
.mc-form{display:flex;flex-direction:column;gap:10px}
.mc-form-row{display:flex;gap:12px;flex-wrap:wrap}
.mcf{display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px}
.mcf-lbl{font-size:9px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em}
.mcf-inp{padding:6px 9px;border:1.5px solid var(--g200);border-radius:5px;font-size:12px;font-family:inherit;color:var(--g900);background:var(--white)}
.mcf-inp:focus{outline:none;border-color:var(--blue)}
.mcf-sel{padding:6px 9px;border:1.5px solid var(--g200);border-radius:5px;font-size:12px;font-family:inherit;color:var(--g900);background:var(--white);cursor:pointer;width:100%}
.mc-run-btn{align-self:flex-start;padding:7px 20px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:background .12s}
.mc-run-btn:hover{background:#1d4ed8}
.mc-result-area{margin-top:10px;background:var(--white);border:1px solid var(--g200);border-radius:7px;overflow:hidden}
.mc-tabs{display:flex;border-bottom:1px solid var(--g200);background:var(--g50)}
.mc-tab{padding:7px 14px;font-size:11px;font-weight:600;color:var(--g500);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;transition:all .12s}
.mc-tab:hover{background:var(--g100)}
.mc-tab.act{color:var(--blue);border-bottom:2px solid var(--blue);background:var(--white)}
.mc-tab-ico{margin-right:3px}
.mc-res-body{padding:12px}
.mc-res-lbl{font-size:9px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.mc-res-txt{font-size:11px;color:var(--g700);background:var(--g50);border:1px solid var(--g200);border-radius:5px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;min-height:56px;margin-bottom:8px;line-height:1.55}
.mc-settle{font-size:11px;color:var(--g700);background:var(--g50);border:1px solid var(--g200);border-radius:5px;padding:6px 10px;margin-top:4px}
.mc-settle-lbl{font-size:9px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
/* ─── PA HISTORY STEP ─────────────────────────────── */
.dup-alert{background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:10px 12px;display:flex;align-items:flex-start;gap:9px;margin:8px 0}
.dup-ico{font-size:15px;flex-shrink:0}
.dup-ttl{font-size:12px;font-weight:700;color:#92400e;margin-bottom:2px}
.dup-detail{font-size:11px;color:#78350f;line-height:1.45}
.ph-clear{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12px;color:var(--g500)}
.ph-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.ph-table th{text-align:left;padding:6px 10px;background:var(--g50);border-bottom:2px solid var(--g200);font-size:9px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em}
.ph-table td{padding:7px 10px;border-bottom:1px solid var(--g100);color:var(--g900);vertical-align:middle}
.ph-table tr:last-child td{border-bottom:none}
.ph-table tbody tr:hover td{background:var(--g50)}
.ph-cur td{background:var(--blue-lt)}
.ph-cur-chip{font-size:9px;font-weight:700;padding:1px 5px;background:var(--blue);color:#fff;border-radius:4px;margin-left:5px}
.ph-a{color:var(--green);font-weight:700}
.ph-d{color:var(--red);font-weight:700}
.ph-r{color:var(--amber);font-weight:700}
/* ─── CRITERIA ────────────────────────────────────── */
.crit-nm{font-size:11px;font-weight:600;color:var(--g500);margin-bottom:10px;display:block}
.notice{border-radius:6px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start;font-size:11px;margin-bottom:8px}
.n-fallout{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.n-dup{background:var(--blue-lt);border:1px solid #bfdbfe;color:#1e40af}
.n-icon{font-size:13px;flex-shrink:0}
.qlist{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.qcard{border:1px solid var(--g200);border-radius:7px;background:var(--white);overflow:hidden}
.qcard.qdoc{border-left:3px solid var(--amber)}
.qhdr{display:flex;align-items:center;gap:7px;padding:8px 12px;cursor:pointer}
.qhdr:hover{background:var(--g50)}
.qn{font-size:10px;font-weight:800;color:var(--g400);width:22px;flex-shrink:0}
.qs{font-size:12px;font-weight:500;color:var(--g900);flex:1;min-width:0}
.dbadge{font-size:9px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap;background:var(--amber-lt);color:#92400e;border:1px solid #fcd34d}
.crbadge{font-size:9px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.abadge{font-size:9px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap;background:var(--green-lt);color:#065f46;border:1px solid #6ee7b7}
.achip{font-size:10px;font-weight:700;padding:2px 9px;border-radius:9px;white-space:nowrap}
.cy{background:var(--g200);color:var(--g700)}
.cn{background:var(--g200);color:var(--g700)}
.qchev{font-size:10px;color:var(--g400);flex-shrink:0}
.qbody{padding:0 12px 11px;border-top:1px solid var(--g100)}
.qfull{font-size:11px;color:var(--g700);line-height:1.65;margin:9px 0 8px}
.ansrow{display:flex;gap:7px;margin-bottom:8px}
.abtn{padding:5px 20px;border-radius:5px;border:1.5px solid var(--g200);background:var(--white);color:var(--g700);font-size:12px;font-weight:600;cursor:pointer;transition:all .1s}
.abtn:hover{background:var(--g50)}
.ay{background:var(--g200);border-color:var(--g500);color:var(--g900)}
.an{background:var(--g200);border-color:var(--g500);color:var(--g900)}
.qact{background:var(--amber-lt);border:1px solid #fde68a;border-radius:5px;padding:6px 9px;font-size:11px;color:#78350f;font-weight:600;margin-bottom:5px}
.qnote{background:var(--g50);border:1px solid var(--g200);border-radius:5px;padding:6px 9px;font-size:11px;color:var(--g700);margin-bottom:5px}
.qev{background:var(--green-lt);border:1px solid #a7f3d0;border-radius:5px;padding:5px 9px;font-size:11px;color:#065f46;margin-bottom:5px}
.qev-green{background:var(--green-lt);border:1px solid #a7f3d0;border-radius:5px;padding:5px 9px;font-size:11px;color:#065f46;margin-bottom:5px}
.qev-amber{background:#fffbeb;border:1px solid #fcd34d;border-radius:5px;padding:5px 9px;font-size:11px;color:#92400e;margin-bottom:5px}
.nlbl,.evlbl{font-weight:700}
.doc-view-btn{display:inline-flex;align-items:center;gap:5px;margin-top:4px;margin-bottom:2px;padding:4px 12px;background:var(--teal-lt);color:var(--teal);border:1.5px solid #7dd3fc;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .12s}
.doc-view-btn:hover{background:#bae6fd}
.calc{background:var(--blue-lt);border:1px solid #bfdbfe;border-radius:6px;padding:8px 10px;margin-bottom:9px}
.calc-fields{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.cf{display:flex;flex-direction:column;gap:3px}
.clbl{font-size:9px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.cinp{width:108px;padding:5px 8px;border:1.5px solid #bfdbfe;border-radius:5px;font-size:13px;background:var(--white)}
.cinp:focus{outline:none;border-color:var(--blue)}
.cres{display:flex;flex-direction:column;gap:2px;padding:5px 8px;background:var(--white);border:1.5px solid #bfdbfe;border-radius:5px;min-width:88px}
.cpass{color:var(--green);font-size:14px;font-weight:800}
.cfail{color:var(--red);font-size:14px;font-weight:800}
.csub{font-size:9px;color:var(--g400)}
.calc-hint{font-size:11px;color:var(--g700);margin-bottom:7px}
.qcomment{display:inline-block;margin:2px 0 9px;padding:6px 11px;border:1.5px dashed var(--g300);border-radius:9px;background:var(--g100);font-size:12px;color:var(--g700)}
.calc-confirm{align-self:flex-end;padding:7px 16px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.calc-confirm:hover:not(:disabled){background:#1d4ed8}
.calc-confirm:disabled{background:var(--g200);color:var(--g400);cursor:not-allowed}
.calc-rec{font-size:11px;color:#065f46;font-weight:600;margin-top:7px}
.crit-foot{border-top:1px solid var(--g100);padding-top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.foot-btns{display:flex;gap:7px;flex-wrap:wrap}
.btn-c{background:var(--white);color:var(--red);border:1.5px solid var(--red);border-radius:6px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer}
.btn-c:hover{background:#fff1f2}
.score-sep{width:100%;border:none;border-top:1px solid var(--g200);margin:0}
.score-row{width:100%;display:flex;justify-content:center;padding:2px 0 4px}
.score-chip{display:inline-flex;align-items:center;padding:9px 42px;border-radius:8px;font-size:19px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.sc-a{background:var(--green-lt);color:#065f46;border:1.5px solid #6ee7b7}
.sc-d{background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5}
.btn-continue{background:var(--green);color:#fff;border:none;border-radius:6px;padding:8px 20px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .12s}
.btn-continue:hover{background:#047857}
/* ─── MOCK CLAIM OUTCOME ──────────────────────── */
.mc-outcome{border-radius:7px;padding:11px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.mc-outcome-reject{background:#fee2e2;border:1.5px solid #fca5a5}

  if(modal){modal.style.display='flex';document.body.style.overflow='hidden';}
}
function closeDoc(){const m=el('doc-modal');if(m){m.style.display='none';document.body.style.overflow='';}}
function closeDocOverlay(e){if(e.target===el('doc-modal'))closeDoc();}

// ── CRITERIA HELPERS ──────────────────────────────────────────────────────────
function calcPct(){
  const c=getWf().calc, w0=parseFloat(c.w0), w1=parseFloat(c.w1);
  return (w0>0&&w1>0)?(1-w1/w0)*100:null;
}
function renderCalc(qno){
  const wf=getWf(), c=wf.calc, pct=calcPct();
  const answered=!!wf.verified[qno];
  const pctTxt=pct!==null?pct.toFixed(1)+'%':'—';
  const pctCls=pct!==null?(pct>=5?'cpass':'cfail'):'';
  const rec=answered?`<div class="calc-rec">Recorded: ${sa[curCase][curLeg][qno]==='T'?'Yes':'No'}</div>`:'';
  return`<div class="calc">
    <div class="calc-hint">Enter the two weights to check the 5% threshold.</div>
    <div class="calc-fields">
      <div class="cf"><span class="clbl">Baseline (lbs)</span>
        <input class="cinp" id="cw0-${qno}" type="number" step="0.1" value="${c.w0}" oninput="updCalc(${qno})">
      </div>
      <div class="cf"><span class="clbl">Current (lbs)</span>
        <input class="cinp" id="cw1-${qno}" type="number" step="0.1" value="${c.w1}" oninput="updCalc(${qno})">
      </div>
      <div class="cf"><span class="clbl">% Loss</span>
        <div class="cres"><span id="cpct-${qno}" class="${pctCls}">${pctTxt}</span><span class="csub">≥5% required</span></div>
      </div>
      <button class="calc-confirm" id="cconf-${qno}" onclick="confirmCalc(${qno})" ${pct===null?'disabled':''}>${answered?'Update answer':'Use result'}</button>
    </div>${rec}
  </div>`;
}
function updCalc(qno){
  const wf=getWf();
  wf.calc.w0=el(`cw0-${qno}`)?.value||''; wf.calc.w1=el(`cw1-${qno}`)?.value||'';
  const pct=calcPct(), s=el(`cpct-${qno}`), btn=el(`cconf-${qno}`);
  if(s){s.textContent=pct!==null?pct.toFixed(1)+'%':'—'; s.className=pct!==null?(pct>=5?'cpass':'cfail'):'';}
  if(btn)btn.disabled=(pct===null);
}
// Questions on the current path that ask the reviewer to verify the prescriber's answer
// (QM[q].act) and have not been verified yet.
function pendingVerify(){
  const wf=getWf(), {steps}=path(sa[curCase][curLeg]);
  return steps.filter(q=>QM[q]&&QM[q].act&&!wf.verified[q]);
}
// After an answer changes, bring back the prescriber's answers for any question that is on the
// new path but was dropped when the path was shorter (for example Q5 and Q6 after a No on Q4).
function restoreInit(ans){
  const init=getLeg().initAns||{};
  for(let i=0;i<60;i++){
    const {steps}=path(ans); let changed=false;
    steps.forEach(q=>{if(ans[q]===undefined&&init[q]!==undefined){ans[q]=init[q];changed=true;}});
    if(!changed)break;
  }
  return ans;
}
function confirmCalc(qno){
  const pct=calcPct(); if(pct===null)return;
  const val=pct>=5?'T':'F';
  let ans=Object.assign({},sa[curCase][curLeg]);
  ans[qno]=val; ans=prune(ans); ans[qno]=val; ans=restoreInit(ans);
  sa[curCase][curLeg]=ans; getWf().verified[qno]=true;
  renderWorkflow();
}
function toggleQ(qno){
  // Open state lives in the workflow state, so it survives re-renders (e.g. after "Use result").
  // The DOM is toggled directly rather than re-rendering, which would drop focus from an input.
  const b=el(`qb-${qno}`), ch=el(`chev-${qno}`); if(!b)return;
  const open=!getWf().qOpen[qno];
  getWf().qOpen[qno]=open;
  b.style.display=open?'block':'none';
  if(ch)ch.textContent=open?'▲':'▼';
}

function renderQCard(qno,ans,leg,isEdit){
  const q=QM[qno]; if(!q)return'';
  const a=ans[qno];
  const attnQs=leg.attnQs||[];
  const isAttn=attnQs.includes(qno);
  // badge: attnQs → "NEEDS ATTN." (amber), doc/act → "CHART REQ." (amber), auto → "Auto Verified" (green)
  let badge='';
  if(isAttn) badge='<span class="dbadge">NEEDS ATTN.</span>';
  else if(q.act) badge=getWf().verified[qno]?'<span class="abadge">Verified</span>':'<span class="dbadge">NEEDS VERIFICATION</span>';
  else if(q.att) badge='<span class="crbadge">Per submission</span>';
  else if((leg.notes&&leg.notes[qno])||(q.auto&&q.ev)) badge='<span class="abadge">Verified</span>';
  else badge='<span class="crbadge">Per submission</span>';

  const chip=(a!==undefined)?`<span class="achip ${a==='T'?'cy':'cn'}">${a==='T'?'Yes':'No'}</span>`:'';
  const calcHtml=(q.calc&&qno===4)?renderCalc(qno):'';
  const note=leg.notes&&leg.notes[qno];
  const hasDocFile=leg.docs&&leg.docs[qno];
  // attnQs: no "View Chart Note" button; regular doc questions: show it
  const docBtn=(!isAttn&&hasDocFile)?`<button class="doc-view-btn" onclick="openDoc(${qno})">📄 View Document</button>`:'';

  const aHtml=isEdit?`<div class="ansrow">
    <button class="abtn${a==='T'?' ay':''}" onclick="setAnsV3(${qno},'T')">Yes</button>
    <button class="abtn${a==='F'?' an':''}" onclick="setAnsV3(${qno},'F')">No</button>
  </div>`:'';

  // every question starts collapsed; the header badge shows where input is needed
  const qOpen=!!getWf().qOpen[qno];
  let bodyContent=`<p class="qfull">${q.f}</p>`;
  if(q.act) bodyContent+=`<p class="qfull" style="margin-top:2px">${q.act}</p>`;
  const cmt=leg.comments&&leg.comments[qno];
  if(cmt) bodyContent+=`<div class="qcomment">${cmt}</div>`;
  if(qno===4)bodyContent+=docBtn;
  bodyContent+=calcHtml;
  if(isEdit) bodyContent+=aHtml;
  const evCls=a==='T'?'qev-green':'qev-amber';
  if(isAttn&&note) bodyContent+=`<div class="qnote"><span class="nlbl">Note:</span> ${note}</div>`;
  else if(note&&!(q.auto&&q.ev)) bodyContent+=`<div class="${evCls}"><span class="evlbl">Evidence:</span> ${note}</div>`;
  if(q.auto&&q.ev) bodyContent+=`<div class="qev"><span class="evlbl">Evidence:</span> ${q.ev}</div>`;
  if(q.att) bodyContent+=`<div class="qnote"><span class="nlbl">Prescriber's answer:</span> ${q.att}</div>`;
  if(qno!==4)bodyContent+=docBtn;

  const hasDocStyle=(q.act||isAttn)?'qdoc':'';
  return`<div class="qcard ${hasDocStyle}" data-qno="${qno}">
    <div class="qhdr" onclick="toggleQ(${qno})">
      <span class="qn">Q${qno}</span><span class="qs">${q.s}</span>
      ${chip}${badge}<span class="qchev" id="chev-${qno}">${qOpen?'▲':'▼'}</span>
    </div>
    <div class="qbody" id="qb-${qno}" style="${qOpen?'':'display:none'}">${bodyContent}</div>
  </div>`;
}

function setAnsV3(qno,val){
  let ans=Object.assign({},sa[curCase][curLeg]);
  ans[qno]=val; ans=prune(ans); ans[qno]=val; ans=restoreInit(ans);
  sa[curCase][curLeg]=ans; if(QM[qno]&&QM[qno].act)getWf().verified[qno]=true;
  renderWorkflow();
}
function cancelAllV3(){
  sa[curCase][curLeg]=Object.assign({},getLeg().initAns||{});
  getWf().calc={w0:'',w1:''}; getWf().verified={};
  renderWorkflow();
}

// ── STEP 4: Criteria Review ───────────────────────────────────────────────────
function renderStep4(c){
  const wf=getWf(), leg=getLeg();
  const ans=sa[curCase][curLeg];
  const sc=score(ans);
  const isEdit=wf.s4Edit;

  // Status: Scored Approval / Scored Denial / Unscored
  let status, statusCls;
  const pend=pendingVerify();
  if(sc==='A'&&pend.length){status='Scored Approval · needs verification'; statusCls='st-warning';}
  else if(sc==='A'){status='Scored Approval'; statusCls='st-complete';}
  else if(sc==='D'){status='Scored Denial'; statusCls='st-denied';}
  else{status='Input required'; statusCls='st-warning';}

  const{steps}=path(ans);
  let notices='';
  if(leg.fallout)notices+=`<div class="notice n-fallout"><span class="n-icon">⚡</span><span><strong>ePA Loop-2 Fallout:</strong> ${leg.fallout}</span></div>`;
  if(sc==='A'&&pend.length)notices+=`<div class="notice n-fallout"><span class="n-icon">⚠</span><span>Scores to <strong>Approval</strong> on the prescriber's answers. ${pend.map(q=>'Q'+q).join(', ')} still ${pend.length>1?'need':'needs'} your verification before you approve.</span></div>`;
  if(leg.dupNote)notices+=`<div class="notice n-dup"><span class="n-icon">ℹ</span><span>${leg.dupNote}</span></div>`;

  const qHtml=steps.length?steps.map(qno=>renderQCard(qno,ans,leg,isEdit)).join(''):`<p style="font-size:12px;color:var(--g400);font-style:italic;padding:6px 0">No criteria path available.</p>`;

  // Footer
  let footerHtml;
  if(isEdit){
    const scoreHtml=sc?`<hr class="score-sep"><div class="score-row"><span class="score-chip ${sc==='A'?'sc-a':'sc-d'}">${sc==='A'?'✓ Approval':'✗ Denial'}</span></div>`:'';
    footerHtml=`<div class="crit-foot">
      <div class="foot-btns">
        <button class="btn-c" onclick="cancelAllV3()">Cancel All</button>
        <button style="padding:7px 14px;background:var(--white);color:var(--blue);border:1.5px solid var(--blue);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer" onclick="s4ToggleEdit()">Exit Edit</button>
      </div>
      ${scoreHtml}
    </div>`;
  }else{
    const scoreHtml=sc?`<hr class="score-sep"><div class="score-row"><span class="score-chip ${sc==='A'?'sc-a':'sc-d'}">${sc==='A'?'✓ Approval':'✗ Denial'}</span></div>`:'';
    footerHtml=`<div class="crit-foot">
      <div class="foot-btns">
        <button style="padding:7px 14px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer" onclick="s4ToggleEdit()">Edit</button>
      </div>
      ${scoreHtml}
    </div>`;
  }

  const bodyHtml=`<div style="padding-top:4px"><span class="crit-nm">${c.meta.name}</span></div>${notices}<div class="qlist">${qHtml}</div>${footerHtml}`;

  return buildStepCard({
    n:4, title:'Criteria Review', sub:'',
    status, statusCls,
    open:wf.s4Open, doneCls:(sc&&!pend.length)?'wf-done':'wf-input', body:bodyHtml,
    toggleFn:'toggleStep(4)',
  });
}

function genNoteV3(){
  const c=getCase(), wf=getWf();
  let note;
  if(CASE_NOTES[c.id]&&score(sa[curCase][curLeg])==='A'&&!pendingVerify().length){
    note=CASE_NOTES[c.id];
  }else{
    const ans=sa[curCase][curLeg], sc=score(ans), {steps}=path(ans);
    const outcome=(sc==='A'&&pendingVerify().length)?'Pending verification':sc==='A'?'Approve for 12 months':sc==='D'?'Deny — criteria not met':'Pending review';
    const leg=getLeg();
    const today=new Date().toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});
    const answered=steps.filter(q=>ans[q]!==undefined);
    note=`Drug: ${c.meta.drug}\nDiagnosis: ${c.meta.dx}\nClinical Info: Reviewed Q${answered.join(', Q')}, documentation verified\nOutcome: ${outcome}\nInitials/Date: ${leg.rev} ${leg.role.split(' ')[0]} ${today}`;
  }
  wf.s5Text=note; wf.s5Gen=true; wf.s5Open=true;
  renderWorkflow();
}
function onNoteChange(){
  const ta=el('notes-ta'); if(!ta)return;
  getWf().s5Text=ta.value;
  const cc=el('ncount'); if(cc)cc.textContent=`Characters remaining: ${3000-ta.value.length}`;
}

// ── STEP 6: Case Decision ─────────────────────────────────────────────────────
function renderStep6(c){
  const wf=getWf(), sc=score(sa[curCase][curLeg]);
  const recApprove=sc==='A'||sc===null;
  let status, statusCls, sub, bodyHtml;
  const pendQ=pendingVerify();
  if((sc===null||pendQ.length)&&wf.s6State==='idle'){
    return buildStepCard({
      n:6, title:'Case Decision', sub:'',
      status:'○ Waiting on verification', statusCls:'st-pending',
      open:wf.s6Open, doneCls:'', toggleFn:'toggleStep(6)',
      body:`<div class="ph-clear" style="padding-top:12px">${pendQ.length?`The criteria score to Approval on the prescriber's answers. Verify ${pendQ.map(q=>'Q'+q).join(', ')} in the Criteria Review first.`:'Finish the Criteria Review first. At least one question is still waiting on your input.'}</div>`,
    });
  }

  if(wf.s6State==='done'){
    status='✓ Approved'; statusCls='st-approved'; sub='';
    bodyHtml=`<div class="dec-success">
      <div class="dec-success-ico">✅</div>
      <div class="dec-success-ttl">PA Approved and Closed</div>
      <div class="dec-success-sub">Case ${c.id} has been approved.<br>The approval has been recorded and the case is now closed.</div>
    </div>`;
  }else if(wf.s6State==='alt-done'){
    const labels={deny:'Denied',pending:'Set to Pending',rfi:'RFI Requested',internal:'Internal Denial',abort:'Aborted'};
    status=`✓ ${labels[wf.s6AltOpt]||'Closed'}`; statusCls='st-pending'; sub='';
    bodyHtml=`<div class="dec-alt-done">
      <div class="dec-alt-done-ttl">Case action completed: ${labels[wf.s6AltOpt]||wf.s6AltOpt}</div>
      <div class="dec-alt-done-sub">Case ${c.id} has been closed with the selected action.</div>
    </div>`;
  }else if(wf.s6State==='confirm'){
    status='● Pending Confirmation'; statusCls='st-active'; sub='';
    bodyHtml=`<div style="padding-top:12px"><div class="dec-rec ${recApprove?'':'dec-deny-rec'}">
      <div class="dec-rec-ico">${recApprove?'✅':'ℹ'}</div>
      <div class="dec-rec-body">
        <div class="dec-rec-ttl">Recommended: ${recApprove?'Approve':'Deny'}</div>
        <div class="dec-rec-sub">${recApprove?'All criteria verified.':'Criteria not fully met.'}</div>
      </div>
    </div>
    <div class="dec-confirm-box">
      <div class="dec-confirm-ttl">Please confirm that you intend to approve this PA.</div>
      <div class="dec-confirm-btns">
        <button class="dec-confirm-btn" onclick="decConfirmApprove()">Confirm Approval</button>
        <button class="dec-back-btn" onclick="decGoBack()">Go Back</button>
      </div>
    </div></div>`;
  }else if(wf.s6State==='alt'){
    status='● Select Action'; statusCls='st-active'; sub='';
    const opts=[
      {k:'internal',lbl:'Internal Denial'},
      {k:'pending', lbl:'Set to Pending'},
      {k:'rfi',     lbl:'RFI'},
      {k:'deny',    lbl:'Deny'},
      {k:'abort',   lbl:'Abort'},
    ];
    const altBtns=opts.map(o=>`<button class="dec-alt-btn${wf.s6AltOpt===o.k?' selected':''}" onclick="decSelectAlt('${o.k}')">${o.lbl}</button>`).join('');
    const confirmBox=wf.s6AltOpt?`<div class="dec-alt-confirm-box">
      <div class="dec-alt-confirm-ttl">Confirm action: ${opts.find(o=>o.k===wf.s6AltOpt)?.lbl}</div>
      <div style="display:flex;gap:7px">
        <button class="dec-confirm-btn" style="background:var(--red)" onclick="decConfirmAlt()">Confirm</button>
        <button class="dec-back-btn" onclick="decGoBack()">Go Back</button>
      </div>
    </div>`:'';
    bodyHtml=`<div style="padding-top:12px"><div class="dec-rec ${recApprove?'':'dec-deny-rec'}">
      <div class="dec-rec-ico">${recApprove?'✅':'⚠️'}</div>
      <div class="dec-rec-body"><div class="dec-rec-ttl">Recommended: ${recApprove?'Approve':'Deny'}</div></div>
    </div>
    <div class="dec-q">Select an alternative close option:</div>
    <div class="dec-alt-list">${altBtns}</div>${confirmBox}</div>`;
  }else{
    // idle
    status='● Active'; statusCls='st-active'; sub='';
    bodyHtml=`<div style="padding-top:12px"><div class="dec-rec ${recApprove?'':'dec-deny-rec'}">
      <div class="dec-rec-ico">${recApprove?'✅':'⚠️'}</div>
      <div class="dec-rec-body">
        <div class="dec-rec-ttl">Recommended decision: ${recApprove?'Approve':'Deny'}</div>
        <div class="dec-rec-sub">${recApprove?'All criteria verified. Documentation complete. Approval is supported.':'Criteria not fully met per documentation on file.'}</div>
      </div>
    </div>
    <div class="dec-q">Would you like to ${recApprove?'approve':'deny'} this PA?</div>
    <div class="dec-btns">
      <button class="dec-yes" onclick="decYes()">Yes</button>
      <button class="dec-no" onclick="decNo()">No — Other Options</button>
    </div></div>`;
  }

  return buildStepCard({
    n:6, title:'Case Decision', sub,
    status, statusCls,
    open:wf.s6Open,
    doneCls:(wf.s6State==='done'||wf.s6State==='alt-done')?'wf-done':'wf-active',
    body:bodyHtml, toggleFn:'toggleStep(6)',
  });
}
function decYes(){getWf().s6State='confirm';renderWorkflow();}
function decNo(){getWf().s6State='alt';getWf().s6AltOpt=null;renderWorkflow();}
function decConfirmApprove(){getWf().s6State='done';renderWorkflow();}
function decGoBack(){getWf().s6State='idle';getWf().s6AltOpt=null;renderWorkflow();}
function decSelectAlt(opt){getWf().s6AltOpt=opt;renderWorkflow();}
function decConfirmAlt(){getWf().s6State='alt-done';renderWorkflow();}

// ── BUILD STEP CARD ───────────────────────────────────────────────────────────
function buildStepCard({n,title,sub,status,statusCls,open,doneCls,body,toggleFn}){
  const openBody=open!==false;
  return`<div class="wf-step ${doneCls||''}" id="step-${n}">
    <div class="wf-step-hdr" onclick="${toggleFn}">
      <div class="wf-step-left">
        <div class="wf-step-num">${n}</div>
        <div class="wf-step-meta">
          <div class="wf-step-title">${title}</div>
          ${sub?`<div class="wf-step-sub">${sub}</div>`:''}
        </div>
      </div>
      <div class="wf-step-right">
        <span class="wf-status ${statusCls}">${status}</span>
        <span class="wf-chev">${openBody?'▲':'▼'}</span>
      </div>
    </div>
    <div class="wf-step-body" id="step-${n}-body" style="${openBody?'':'display:none'}">${body}</div>
  </div>`;
}

// ── STEP TOGGLE ───────────────────────────────────────────────────────────────
function toggleStep(n){
  const wf=getWf();
  const keys={1:'s1Open',2:'s2Card',3:'s3Open',4:'s4Open',5:'s5Open',6:'s6Open'};
  const k=keys[n]; if(!k)return;
  wf[k]=!wf[k];
  renderWorkflow();
}

// ── RENDER WORKFLOW ───────────────────────────────────────────────────────────
function renderWorkflow(){
  const c=getCase();
  const container=el('wf-steps'); if(!container)return;
  container.innerHTML=
    renderStep1(c)+
    renderStep3(c)+
    renderStep2(c)+
    renderStep4(c)+
    renderStep5(c)+
    renderStep6(c);
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function selectCase(idx){
  curCase=parseInt(idx); curLeg=0;
  renderAll();
}
function selectLeg(idx){
  curLeg=idx;
  renderAll();
}

// ── RENDER ALL ────────────────────────────────────────────────────────────────
function renderAll(){
  updateTop(); syncDemoSel(); renderBarRole(); renderStrip(); renderLegBar();
  renderMember(); renderPAInfo(); renderMemberCenter();
  renderWorkflow();
}
document.addEventListener('DOMContentLoaded',()=>renderAll());

</script>
</body>
</html>
